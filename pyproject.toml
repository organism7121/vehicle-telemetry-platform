[project]
name = "vehicle-telemetry-platform"
version = "0.1.0"
description = "CAN bus data pipeline"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "asammdf>=8.8.32",
    "cantools>=45.1.0",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "websockets>=17.3",
]

[project.scripts]
vehicle-telemetry-platform = "vehicle_telemetry_platform:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
